name: Keep awake

# Render's free plan sleeps after about 15 minutes without traffic, and the delivery worker sleeps with it.
# This pings the API every 5 minutes so it stays up. GitHub can run scheduled jobs late, so 5 minutes leaves room.
# Set the repository variable HOOKFLOW_API_URL (e.g. https://hookflow-api.onrender.com) to turn it on.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.HOOKFLOW_API_URL != '' }}
    steps:
      - name: Ping /health/live
        run: |
          # A sleeping instance can take up to a minute to wake, so allow for that and retry twice.
          curl -fsS --max-time 90 --retry 2 --retry-delay 10 "${{ vars.HOOKFLOW_API_URL }}/health/live"
